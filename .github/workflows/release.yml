name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Find tested artifacts
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\([^" ]*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag must match version $version in Cargo.toml." >&2
            exit 1
          fi
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "CI must pass on $GITHUB_SHA before packaging a release." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run_id }}
          pattern: dotheap-*
          path: artifacts
      - name: Package tested binaries
        env:
          VERSION: ${{ steps.ci.outputs.version }}
        run: |
          mkdir dist
          cp artifacts/dotheap-macos-arm64/* dist/
          for arch in x86_64 aarch64; do
            chmod 755 "artifacts/dotheap-linux-$arch/dotheap"
            tar -czf "dist/dotheap-linux-$arch.tar.gz" LICENSE THIRD-PARTY-NOTICES.txt \
              -C "artifacts/dotheap-linux-$arch" dotheap
          done
          zip -j dist/dotheap-windows-x64.zip artifacts/dotheap-windows-x64/dotheap.exe LICENSE THIRD-PARTY-NOTICES.txt
          git archive --format=tar.gz --prefix="dotheap-$VERSION/" HEAD > dist/dotheap-source.tar.gz
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: release-packages
          path: dist/*
          retention-days: 14
      - name: Publish draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes *
