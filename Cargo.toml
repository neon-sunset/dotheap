[workspace]
members = ["crates/heap-core", "crates/dotheap", "crates/heap-bridge"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
cpp_demangle = "0.5"
flate2 = "1.1"
libc = "0.2"
memchr = "2.8"
memmap2 = "0.9"
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tempfile = "3.27"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Xcode 27's stripped proc-macro libraries can have an invalid LINKEDIT string-pool alignment.
[profile.release.build-override]
strip = false
